.c0{animation-delay:.3s}.c1{animation-delay:.8s}.c2{animation-delay:1.3s}.c3{animation-delay:1.8s}.cn{animation-delay:2.3s}
.cur{animation:blink 1.1s steps(1) infinite}@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.p{animation:none;opacity:1}.cur{animation:none}}
</style>
